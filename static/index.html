<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#059669">
    <meta name="description" content="Gemini2API Management Console">
    <title>Gemini2API - Admin Console</title>
    <link rel="icon" type="image/png" href="components/logo.png?v=1">
    <link rel="stylesheet" href="app/base.css?v=7">
    <link rel="stylesheet" href="app/mobile.css?v=3">
    <link rel="stylesheet" href="app/payload-inspector.css?v=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
          crossorigin="anonymous" referrerpolicy="no-referrer">
    <script>
        // Classic (blocking) script on purpose: module scripts are deferred and cause a flash of the light theme.
        (function () {
            try {
                var saved = localStorage.getItem('gemini2api_theme');
                if (saved) {
                    if (saved === 'dark') saved = 'vercel-dark';
                    if (saved === 'light') saved = 'vercel-light';
                    document.documentElement.setAttribute('data-theme', saved);
                } else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.setAttribute('data-theme', 'vercel-dark');
                }
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <div class="container">
        <!-- Header will be inserted here by component-loader -->

        <div class="main-content">
            <!-- Sidebar container -->
            <div id="sidebar-container"></div>

            <!-- Content Area -->
            <main class="content" role="main" id="content-container">
                <!-- Sections will be inserted here by component-loader -->
            </main>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Scripts -->
    <script type="module">
        import { initializeComponents } from './app/component-loader.js';

        (async function() {
            try {
                await initializeComponents();
            } catch (error) {
                console.error('Failed to load components:', error);
                document.body.innerHTML = '<div style="padding:2rem;text-align:center;"><h2>Loading Failed</h2><p>Please refresh the page to retry</p></div>';
            }
        })();
    </script>
    <script type="module" src="app/app.js?v=20"></script>
</body>
</html>
