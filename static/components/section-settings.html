<link rel="stylesheet" href="components/section-settings.css?v=3">
<script type="module" src="app/settings.js"></script>
<section id="settings" class="section" aria-labelledby="settings-title">
    <h2 id="settings-title" data-i18n="settings.title">Settings</h2>
    <p class="section-desc" data-i18n="settings.description">Manage runtime application settings with immediate effect.</p>

    <div id="settings-container" class="settings-groups">
        <div class="chart-loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
    </div>

    <div class="settings-actions">
        <button class="btn btn-primary" id="settings-save-btn">
            <i class="fas fa-save"></i> <span data-i18n="settings.save">Save Settings</span>
        </button>
        <button class="btn btn-outline" id="settings-reset-btn">
            <i class="fas fa-undo"></i> <span data-i18n="settings.reset">Reset</span>
        </button>
    </div>

    <div id="model-mapping-container" class="settings-groups" style="margin-top:1.5rem">
    </div>

    <!-- Configuration readiness -->
    <section class="config-panel" aria-labelledby="config-title" style="margin-top:2rem">
        <div class="system-info-header">
            <h3 id="config-title"><i class="fas fa-sliders"></i> <span data-i18n="dashboard.configTitle">Configuration readiness</span></h3>
            <span id="config-state" class="slo-state slo-state--unknown" role="status" aria-live="polite"></span>
        </div>
        <p class="debug-metrics-privacy" data-i18n="dashboard.configPrivacy">Effective runtime configuration. Secrets are never rendered.</p>
        <div class="config-columns">
            <div class="config-column">
                <h4 data-i18n="dashboard.configEffective">Effective configuration</h4>
                <table class="slo-table">
                    <caption class="sr-only" data-i18n="dashboard.configEffective">Effective configuration</caption>
                    <thead>
                        <tr>
                            <th scope="col" data-i18n="dashboard.configField">Setting</th>
                            <th scope="col" data-i18n="dashboard.configValue">Value</th>
                            <th scope="col" data-i18n="dashboard.configSource">Source</th>
                            <th scope="col" data-i18n="dashboard.configRestart">Restart</th>
                        </tr>
                    </thead>
                    <tbody id="config-rows">
                        <tr><td colspan="4" class="text-muted" data-i18n="dashboard.configNoData">No data</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="config-column">
                <h4 data-i18n="dashboard.configFeatures">Features</h4>
                <dl class="slo-metrics" id="config-features"></dl>
                <h4 data-i18n="dashboard.configSecrets">Credentials</h4>
                <dl class="slo-metrics" id="config-secrets"></dl>
                <h4 data-i18n="dashboard.configValidation">Validation</h4>
                <ul class="explorer-markers" id="config-issues"></ul>
            </div>
        </div>
    </section>
</section>
