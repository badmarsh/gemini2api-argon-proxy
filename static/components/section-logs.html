<link rel="stylesheet" href="components/section-logs.css?v=3">
<section id="logs" class="section">
    <div class="section-header">
        <h2><i class="fas fa-file-alt"></i> <span data-i18n="logs.title">Logs</span></h2>
        <div class="log-controls">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="log-search" data-i18n-placeholder="logs.search" placeholder="Search logs..." />
            </div>
            <div class="btn-group" id="log-traffic-type">
                <button class="btn btn-sm active" data-value="completions" title="Completions endpoints only"><i class="fas fa-comments"></i> Completions</button>
                <button class="btn btn-sm" data-value="ai" title="Generative AI completions and streams only"><i class="fas fa-brain"></i> Generative AI</button>
                <button class="btn btn-sm" data-value="all" title="Show all traffic including admin/health"><i class="fas fa-list"></i> All Traffic</button>
            </div>
            <div class="btn-group" id="log-direction">
                <button class="btn btn-sm active" data-value="all" data-i18n="logs.all">All</button>
                <button class="btn btn-sm" data-value="ingress" data-i18n="logs.ingress">Ingress</button>
                <button class="btn btn-sm" data-value="egress" data-i18n="logs.egress">Egress</button>
            </div>
            <div class="log-actions">
                <button class="btn btn-sm btn-outline" id="log-refresh-btn" data-i18n-title="dashboard.refresh" title="Refresh">
                    <i class="fas fa-sync-alt"></i>
                </button>
                <button class="btn btn-sm btn-outline" id="log-toggle-btn" title="Pause/Resume">
                    <i class="fas fa-pause"></i>
                </button>
                <button class="btn btn-sm btn-outline" id="log-clear-btn" data-i18n-title="logs.clear" title="Clear">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="logs-layout">
        <div class="logs-table-wrap">
            <table class="logs-table">
                <thead>
                    <tr>
                        <th data-i18n="logs.time">Time</th>
                        <th data-i18n="logs.direction">Direction</th>
                        <th data-i18n="logs.method">Method</th>
                        <th data-i18n="logs.path">Path</th>
                        <th data-i18n="logs.status">Status</th>
                        <th data-i18n="logs.latency">Latency</th>
                        <th data-i18n="logs.ttft">TTFT</th>
                        <th data-i18n="logs.servedBy">Served by</th>
                        <th data-i18n="logs.model">Model</th>
                    </tr>
                </thead>
                <tbody id="logs-tbody"></tbody>
            </table>
            <div class="logs-empty" id="logs-empty">
                <i class="fas fa-file-alt"></i>
                <p data-i18n="logs.noLogs">No logs</p>
            </div>
        </div>
        <div class="logs-detail" id="logs-detail">
            <div class="detail-header">
                <h4 data-i18n="logs.detail">Details</h4>
                <button class="btn btn-sm btn-outline" id="log-detail-close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <pre id="log-detail-json"></pre>
        </div>
    </div>

    <div class="logs-pagination">
        <button class="btn btn-sm btn-outline" id="log-prev-btn">
            <i class="fas fa-chevron-left"></i> <span data-i18n="logs.prevPage">Previous</span>
        </button>
        <span id="log-page-info">-</span>
        <button class="btn btn-sm btn-outline" id="log-next-btn">
            <span data-i18n="logs.nextPage">Next</span> <i class="fas fa-chevron-right"></i>
        </button>
    </div>
</section>
