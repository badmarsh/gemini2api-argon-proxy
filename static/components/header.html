<!-- Header -->
<link rel="stylesheet" href="components/header.css?v=4">
<header class="header">
    <div class="header-content">
        <div class="header-brand">
            <h1><img src="components/logo.png?v=1" class="brand-logo" alt="Gemini2API"> <span data-i18n="header.title">Gemini2API</span></h1>
            <span class="header-subtitle" data-i18n="header.subtitle">Admin Console</span>
        </div>
        <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Menu" title="Menu">
            <i class="fas fa-bars"></i>
        </button>
        <div class="header-controls" id="headerControls">
            <span class="status-badge" id="serverStatus">
                <i class="fas fa-circle"></i> <span class="status-text" data-i18n="header.status.running">Running</span>
            </span>
            <button id="themeToggleBtn" class="theme-toggle" aria-label="Toggle Theme" title="Toggle Theme">
                <i class="theme-icon-indicator fas fa-moon"></i>
            </button>
            <a href="https://github.com/badmarsh/gemini2api" target="_blank" rel="noopener noreferrer" class="logout-btn" title="GitHub" style="text-decoration:none">
                <i class="fab fa-github"></i>
            </a>
            <button id="restartBtn" class="logout-btn restart-btn" data-i18n-title="header.restart" title="Restart Service">
                <i class="fas fa-sync-alt"></i> <span data-i18n="header.restart">Restart</span>
            </button>
            <button id="logoutBtn" class="logout-btn" data-i18n-title="header.logout" title="Sign Out">
                <i class="fas fa-sign-out-alt"></i> <span data-i18n="header.logout">Sign Out</span>
            </button>
        </div>
    </div>
</header>
